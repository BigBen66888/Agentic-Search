[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "search-r1-refine"
version = "0.3.0"
description = "Multi-turn search agent: 21M-passage RRF retrieval, SFT cold start, GRPO"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "requests>=2.31",
  "huggingface_hub>=0.22",
  "pandas>=2.0",
  "pyarrow>=12.0",
  "tqdm>=4.66",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0"
]

[project.optional-dependencies]
retrieval = [
  "faiss-gpu-cu12==1.12.0; platform_system == 'Linux'",
  "faiss-cpu==1.12.0; platform_system != 'Linux'",
  "bm25s==0.2.6",
  "rank-bm25==0.2.2",
  "transformers==4.48.3",
  "sentencepiece==0.2.0",
]
train = ["ray[default]==2.40.0", "vllm==0.7.0", "hydra-core==1.3.2", "wandb>=0.16"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["search_r1_refine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
