[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "search-r1-refine"
version = "0.1.0"
description = "Cost-aware Search-R1 refinement"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "requests>=2.31",
  "datasets>=2.18",
  "huggingface_hub>=0.22",
  "pandas>=2.0",
  "pyarrow>=12.0",
  "tqdm>=4.66",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0"
]

[project.optional-dependencies]
retrieval = ["faiss-cpu>=1.7.4", "rank-bm25>=0.2.2", "transformers>=4.40", "sentencepiece>=0.2"]
rewrite = ["transformers>=4.40", "accelerate>=0.27", "sentencepiece>=0.2"]
train = ["ray>=2.9", "hydra-core>=1.3", "wandb>=0.16"]
all = ["faiss-cpu>=1.7.4", "rank-bm25>=0.2.2", "transformers>=4.40", "sentencepiece>=0.2", "accelerate>=0.27", "ray>=2.9", "hydra-core>=1.3", "wandb>=0.16"]

[tool.setuptools.packages.find]
include = ["search_r1_refine*"]
